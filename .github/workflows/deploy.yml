name: Docker Build and Deploy via SSH

on:
  push:
    branches:
      - main # 배포할 브랜치 지정

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'
            cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # latest는 서버 수동 복구(docker compose 등)용 폴백 태그
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy-via-ssh:
    needs: build-and-push # 이미지 빌드 후 실행
    runs-on: ubuntu-latest
    # NEW/OLD 판별은 각 SSH 스크립트가 서버의 nginx conf를 직접 읽어 수행한다.
    # (구버전은 러너에서 ssh-action outputs.stdout으로 전달했는데, 이 출력이 항상 빈 값이라
    #  매 배포가 NEW=demo-app 고정 → 라이브 컨테이너를 먼저 죽이는 중단 배포로 동작했음)
    steps:
      - name: SSH into server and deploy new container
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.REMOTE_SSH_HOST }}
          username: ${{ secrets.REMOTE_SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          timeout: 60s
          envs: GHCR_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY,GITHUB_SHA
          script: |
            CURRENT=$(grep -Po 'proxy_pass http://\K[a-zA-Z0-9\-]+(?=:8888;)' /home/dev/nginx/conf.d/default.conf | head -n1 | tr -d '')
            if [ "$CURRENT" = "demo-app" ]; then
              NEW_CONTAINER=demo-app-green; NEW_PORT=8889
            else
              NEW_CONTAINER=demo-app; NEW_PORT=8888
            fi
            echo "CURRENT=$CURRENT -> NEW=$NEW_CONTAINER ($NEW_PORT)"

            echo "=== Server snapshot (배포 전) ==="
            nproc; free -m; uptime
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            echo "================================"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            docker pull ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA
            docker rm -f $NEW_CONTAINER 2>/dev/null || true
            # cpu-shares=512: 부팅 중 CPU 경합 시 서비스 중인 기존 컨테이너(1024)에 우선권.
            # JVM 기동 버스트가 라이브 트래픽을 굶겨 502를 내던 문제 방지. 전환 후 1024로 복구.
            docker run -d \
              --name $NEW_CONTAINER \
              --restart unless-stopped \
              --cpu-shares=512 \
              --network app-network \
              -p $NEW_PORT:8888 \
              -e TZ=Asia/Seoul \
              -e JAVA_TOOL_OPTIONS="-Duser.timezone=Asia/Seoul" \
              -v /home/dev/config/application-prod.properties:/app/config/application-prod.properties \
              ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA

      - name: new container check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_SSH_HOST }}
          username: ${{ secrets.REMOTE_SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          timeout: 60s
          script: |
            CURRENT=$(grep -Po 'proxy_pass http://\K[a-zA-Z0-9\-]+(?=:8888;)' /home/dev/nginx/conf.d/default.conf | head -n1 | tr -d '')
            if [ "$CURRENT" = "demo-app" ]; then
              NEW_CONTAINER=demo-app-green; NEW_PORT=8889
            else
              NEW_CONTAINER=demo-app; NEW_PORT=8888
            fi
            echo "CURRENT=$CURRENT -> checking NEW=$NEW_CONTAINER ($NEW_PORT)"

            for i in {1..30}; do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$NEW_PORT/health || echo "000")
              echo "Health check attempt $i: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed, waiting for app to fully initialize..."
                sleep 10
                # 추가 확인: 연속 3회 성공해야 전환
                SUCCESS=0
                for j in {1..3}; do
                  CHECK=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$NEW_PORT/health || echo "000")
                  if [ "$CHECK" = "200" ]; then
                    SUCCESS=$((SUCCESS + 1))
                    echo "Readiness check $j: OK"
                  else
                    echo "Readiness check $j: FAILED"
                    break
                  fi
                  sleep 2
                done
                if [ "$SUCCESS" = "3" ]; then
                  echo "App is fully ready"
                  exit 0
                fi
              fi
            done
            echo "Health check failed - showing container logs:"
            docker logs $NEW_CONTAINER
            docker rm -f $NEW_CONTAINER
            exit 1

      # 전환과 구 컨테이너 정리를 한 SSH 세션에서 처리 — 별도 재접속 단계가
      # 간헐적 connect timeout으로 실패하며 구 컨테이너가 남는 문제 방지
      - name: Switch traffic and clean up old container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_SSH_HOST }}
          username: ${{ secrets.REMOTE_SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          timeout: 60s
          script: |
            CURRENT=$(grep -Po 'proxy_pass http://\K[a-zA-Z0-9\-]+(?=:8888;)' /home/dev/nginx/conf.d/default.conf | head -n1 | tr -d '')
            if [ "$CURRENT" = "demo-app" ]; then
              NEW_CONTAINER=demo-app-green; NEW_PORT=8889; OLD_CONTAINER=demo-app
            else
              NEW_CONTAINER=demo-app; NEW_PORT=8888; OLD_CONTAINER=demo-app-green
            fi
            echo "CURRENT=$CURRENT -> switching to NEW=$NEW_CONTAINER ($NEW_PORT), OLD=$OLD_CONTAINER"

            # 전환 전 새 컨테이너 최종 확인
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$NEW_PORT/health || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "New container not ready, aborting switch"
              exit 1
            fi

            # Nginx 설정 변경
            sed -i "s|proxy_pass http://[a-zA-Z0-9\-]\+:8888;|proxy_pass http://$NEW_CONTAINER:8888;|" /home/dev/nginx/conf.d/default.conf

            # Nginx 설정 검증 후 reload
            docker exec nginx-server nginx -t && docker exec nginx-server nginx -s reload

            echo "Nginx switched to $NEW_CONTAINER"
            sleep 5

            # 전환 후 실제 서비스 확인 (exit 0 금지 — 아래 정리 단계까지 이어져야 함)
            SWITCH_OK=0
            for i in {1..5}; do
              LIVE_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/health || echo "000")
              echo "Live check $i: $LIVE_STATUS"
              if [ "$LIVE_STATUS" = "200" ]; then
                SWITCH_OK=1
                break
              fi
              sleep 2
            done
            if [ "$SWITCH_OK" = "1" ]; then
              echo "Traffic switch successful"
            else
              echo "Warning: Live check failed but continuing..."
            fi

            echo "Waiting for existing connections to drain..."
            sleep 10
            docker rm -f $OLD_CONTAINER 2>/dev/null || echo "Container $OLD_CONTAINER not found or already removed"
            echo "Old container cleanup completed"

            # 부팅용으로 낮췄던 CPU 가중치를 원상 복구
            docker update --cpu-shares=1024 $NEW_CONTAINER || true

            # 사용하지 않는 3일 이전 이미지 정리 (실행 중인 컨테이너의 이미지는 제외됨)
            docker image prune -af --filter "until=72h" || true
